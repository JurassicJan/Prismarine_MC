name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smooth-prismarine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon

      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: smooth-prismarine
          path: |
            smooth-prismarine/build/libs/*.jar
            !smooth-prismarine/build/libs/*-sources.jar
